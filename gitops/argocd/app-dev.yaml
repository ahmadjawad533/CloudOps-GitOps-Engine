apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-app-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cloudicraft-platform
  source:
    repoURL: "https://github.com/cloudicraft/gitops-k8s-delivery-pipeline.git"
    targetRevision: HEAD
    path: gitops/kustomize/overlays/dev
  destination:
    server: "https://kubernetes.default.svc"
    namespace: sample-app-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
