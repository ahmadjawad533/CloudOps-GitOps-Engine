name: GitOps - Automatic Staging Image Tag Bump

on:
  workflow_dispatch:
    inputs:
      new_tag:
        description: 'New Docker Image Tag (e.g. v1.1.0 or sha-xxxxxxx)'
        required: true
        default: 'v1.1.0'

jobs:
  promote:
    name: Promote Image to GitOps Staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.3.0"

      - name: Update Staging Image Tag
        run: |
          cd gitops/kustomize/overlays/staging
          kustomize edit set image ghcr.io/cloudicraft/gitops-sample-service=ghcr.io/cloudicraft/gitops-sample-service:${{ github.event.inputs.new_tag }}

      - name: Create Pull Request / Direct Commit
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(gitops): promote image to staging ${{ github.event.inputs.new_tag }}"
          title: "GitOps Promotion: Bump staging to ${{ github.event.inputs.new_tag }}"
          body: |
            Automated GitOps Promotion PR
            - Target: `gitops/kustomize/overlays/staging`
            - New Image Tag: `${{ github.event.inputs.new_tag }}`
            - Triggered By: @${{ github.actor }}
          branch: "gitops-promote-staging-${{ github.event.inputs.new_tag }}"
          labels: "gitops, automated-pr, staging"
